# Deploys the Zalo Mini App from GitHub's network (the cloud sandbox cannot reach Zalo's login service).
# Zalo logins last ~24h, so every run needs one QR scan: the QR is published to the temporary branch `zalo-qr` (qr.png).
# Run it from Claude ("deploy Zalo") or manually: Actions → Deploy Zalo Mini App → Run workflow.
name: Deploy Zalo Mini App
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Đưa lên môi trường nào'
        type: choice
        default: development
        options: [development, testing]
      note:
        description: 'Mô tả phiên bản'
        type: string
        default: 'cap nhat'
permissions:
  contents: write   # only to publish the temporary QR branch `zalo-qr`
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ID: '2847107362388346804'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install + build
        run: |
          npm ci --prefix apps/viec-thoi-vu
          npm install --no-audit --no-fund --prefix apps/viec-thoi-vu/zalo
          npm run build --prefix apps/viec-thoi-vu/zalo
      - name: Login (QR) + deploy in background
        working-directory: apps/viec-thoi-vu/zalo
        env:
          STATUS: ${{ inputs.env }}
          NOTE: ${{ inputs.note }}
          OUT: /tmp/zout
        run: |
          mkdir -p /tmp/zout
          nohup python3 ci/deploy.py > /tmp/zout/log.txt 2>&1 &
          GH_TOKEN=${{ github.token }} nohup bash ci/publish_qr.sh > /tmp/zout/publish.txt 2>&1 &
          sleep 3
      - name: Wait for result
        run: |
          for _ in $(seq 1 600); do [ -f /tmp/zout/done ] && break; sleep 2; done
          echo "---- log ----"; cat /tmp/zout/log.txt || true
          cat /tmp/zout/publish.txt || true
          echo "---- result ----"; cat /tmp/zout/result.txt
          sleep 25   # let publish_qr.sh delete the temporary QR branch before the job ends
          grep -q '^OK' /tmp/zout/result.txt
